[package]
name = "kirchi-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Motor de simulación de Kirchi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
faer = { version = "0.24", optional = true, default-features = false, features = ["std", "sparse-linalg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
# La LU dispersa entra por omisión: el motor la usa en los circuitos grandes (también en WASM).
default = ["faer"]
faer = ["dep:faer"]
# Tiempos por fase en `Transient::perfil` (Instant no existe en wasm32: solo para los ejemplos nativos).
perfil = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
