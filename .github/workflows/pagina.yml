# Publica la página de descarga (carpeta pagina/) en GitHub Pages.
# Corre al publicar un Release, para que la página salga junto con sus instaladores, o a mano.
name: Página

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pagina
      - id: despliegue
        uses: actions/deploy-pages@v4
